name: Build Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择构建平台（all 或逗号分隔：macos,windows,android）'
        required: true
        default: 'all'
        type: string
      # 源码分支（默认 main，定制构建时可手动选择其他分支）
      client_ref:
        description: '源码分支名（默认 main；如需打定制版，填写 PangHu-Code/client 上对应的分支名）'
        required: false
        default: 'main'
        type: string
      # 品牌配置参数
      brand_app_name:
        description: '应用名称（英文，用于 exe/app 文件名）'
        required: true
        type: string
      brand_display_name:
        description: '显示名称（可中文，用于界面显示）'
        required: true
        type: string
      brand_package_id:
        description: '完整包名（如 com.panghu.demo）'
        required: true
        type: string
      brand_oss_urls:
        description: 'OSS 配置地址（多个用逗号分隔）'
        required: true
        type: string
      # Bot 回调参数（可选，Bot 触发时填写）
      build_id:
        description: '打包任务 ID（Bot 触发时自动填写）'
        required: false
        type: string
      callback_url:
        description: '回调地址（Bot 触发时自动填写）'
        required: false
        type: string

jobs:
  build-macos:
    if: ${{ github.event.inputs.platform == 'all' || contains(format(',{0},', github.event.inputs.platform), ',macos,') }}
    runs-on: macos-14
    outputs:
      file_name: ${{ steps.build.outputs.file_name }}
      file_size: ${{ steps.build.outputs.file_size }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: PangHu-Code/client
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.client_ref || 'main' }}
          submodules: recursive

      - name: Use published yaml_writer package
        shell: bash
        run: |
          if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
            perl -0pi -e "s#  yaml_writer:\r?\n    git:\r?\n      url: [\"']?https://github\.com/chen08209/yaml_writer[\"']?\r?\n      ref: [\"']?master[\"']?#  yaml_writer: ^2.1.0#g" pubspec.yaml
            if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
              echo "Failed to replace yaml_writer git dependency"
              exit 1
            fi
            rm -f pubspec.lock
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          retry = 5
          git-fetch-with-cli = true
          EOF

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-rust-api-${{ runner.os }}-${{ hashFiles('plugins/rust_api/rust/Cargo.lock') }}
          restore-keys: |
            cargo-macos-rust-api-${{ runner.os }}-

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          cd plugins/rust_api/rust
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            echo "cargo fetch failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          cargo fetch --locked

      - name: Setup Flutter (macOS arm64)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Set brand variables
        id: brand
        run: |
          echo "app_name=${{ github.event.inputs.brand_app_name }}" >> $GITHUB_OUTPUT
          echo "display_name=${{ github.event.inputs.brand_display_name }}" >> $GITHUB_OUTPUT
          echo "package_id=${{ github.event.inputs.brand_package_id }}" >> $GITHUB_OUTPUT

      - name: Build Core (macOS arm64)
        run: |
          cd core
          mkdir -p ../libclash/macos
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s" -tags="with_gvisor" -o ../libclash/macos/${{ steps.brand.outputs.app_name }}Core

      - name: Apply brand config
        env:
          BRAND_APP_NAME: ${{ github.event.inputs.brand_app_name }}
          BRAND_DISPLAY_NAME: ${{ github.event.inputs.brand_display_name }}
          BRAND_PACKAGE_ID: ${{ github.event.inputs.brand_package_id }}
          BRAND_OSS_URLS: ${{ github.event.inputs.brand_oss_urls }}
        run: dart scripts/apply_brand.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --dart-define=APP_ENV=stable

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Create DMG and get info
        id: build
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME="${{ steps.brand.outputs.app_name }}"
          DISPLAY_NAME="${{ steps.brand.outputs.display_name }}"

          # 创建 DMG 配置文件
          cat > dmg_config.json <<EOF
          {
            "title": "$DISPLAY_NAME",
            "icon": "../../../../macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png",
            "background": "../../../../macos/packaging/dmg/background.png",
            "window": {
              "size": {
                "width": 660,
                "height": 400
              }
            },
            "contents": [
              { "x": 180, "y": 170, "type": "file", "path": "$DISPLAY_NAME.app" },
              { "x": 480, "y": 170, "type": "link", "path": "/Applications" }
            ]
          }
          EOF

          # 生成 DMG
          FILE_NAME="${APP_NAME}-macos-arm64.dmg"
          appdmg dmg_config.json "$FILE_NAME" || {
            echo "appdmg failed, fallback to ZIP"
            FILE_NAME="${APP_NAME}-macos.zip"
            zip -r "$FILE_NAME" "$DISPLAY_NAME.app"
          }

          FILE_SIZE=$(stat -f%z "$FILE_NAME")
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/${{ steps.build.outputs.file_name }}

  build-macos-intel:
    if: ${{ github.event.inputs.platform == 'all' || contains(format(',{0},', github.event.inputs.platform), ',macos,') }}
