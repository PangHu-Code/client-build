          name: macos-intel-build
          path: build/macos/Build/Products/Release/${{ steps.build.outputs.file_name }}

  build-windows:
    if: ${{ github.event.inputs.platform == 'all' || contains(format(',{0},', github.event.inputs.platform), ',windows,') }}
    runs-on: windows-latest
    outputs:
      file_name: ${{ steps.build.outputs.file_name }}
      file_size: ${{ steps.build.outputs.file_size }}
      exe_file_name: ${{ steps.build_exe.outputs.file_name }}
      exe_file_size: ${{ steps.build_exe.outputs.file_size }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: PangHu-Code/client
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.client_ref || 'main' }}
          submodules: recursive

      - name: Use published yaml_writer package
        shell: bash
        run: |
          if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
            perl -0pi -e "s#  yaml_writer:\r?\n    git:\r?\n      url: [\"']?https://github\.com/chen08209/yaml_writer[\"']?\r?\n      ref: [\"']?master[\"']?#  yaml_writer: ^2.1.0#g" pubspec.yaml
            if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
              echo "Failed to replace yaml_writer git dependency"
              exit 1
            fi
            rm -f pubspec.lock
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/helper/target
          key: cargo-windows-helper-${{ runner.os }}-${{ hashFiles('services/helper/Cargo.lock') }}
          restore-keys: |
            cargo-windows-helper-${{ runner.os }}-

      - name: Setup Flutter (Windows)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Set brand variables
        id: brand
        shell: bash
        run: |
          echo "app_name=${{ github.event.inputs.brand_app_name }}" >> $GITHUB_OUTPUT
          echo "display_name=${{ github.event.inputs.brand_display_name }}" >> $GITHUB_OUTPUT
          echo "package_id=${{ github.event.inputs.brand_package_id }}" >> $GITHUB_OUTPUT

      - name: Apply brand config
        env:
          BRAND_APP_NAME: ${{ github.event.inputs.brand_app_name }}
          BRAND_DISPLAY_NAME: ${{ github.event.inputs.brand_display_name }}
          BRAND_PACKAGE_ID: ${{ github.event.inputs.brand_package_id }}
          BRAND_OSS_URLS: ${{ github.event.inputs.brand_oss_urls }}
        run: dart scripts/apply_brand.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          cd services/helper
          cargo fetch --locked

      # v0.8.93: buildkit 预编译 Go core + Rust helper，写 core_sha256.json
      # apply_brand 已生成 build_config.yaml（品牌化 core/helper 名）；
      # helper 的 SERVICE_NAME 由 buildkit rust_builder 注入（= helper_name）。
      - name: Build Core + Helper (buildkit)
        id: helper
        shell: pwsh
        run: |
          & "plugins/setup/buildkit/run_build_tool.cmd" windows
          if ($LASTEXITCODE -ne 0) { throw "build_tool windows failed: $LASTEXITCODE" }
          $sha = (Get-Content core_sha256.json -Raw | ConvertFrom-Json).CORE_SHA256
          Write-Host "Core SHA256: $sha"
          "core_sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_ENV=stable --dart-define=CORE_SHA256=${{ steps.helper.outputs.core_sha256 }}

      - name: Copy VC++ Runtime DLLs
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (!$vsPath) {
            throw "Visual Studio installation not found"
          }
          $redistBase = "$vsPath\VC\Redist\MSVC"
          # 动态查找 CRT 目录（名称可能是 Microsoft.VC14x.CRT）
          $vcDir = Get-ChildItem "$redistBase\*\x64\Microsoft.VC*.CRT" -Directory | Select-Object -First 1
          if (!$vcDir) {
            throw "VC++ CRT directory not found under $redistBase"
          }
          Write-Host "VC++ CRT dir: $($vcDir.FullName)"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "$($vcDir.FullName)\$dll" "$releaseDir\" -Force
            Write-Host "Copied $dll"
          }

      - name: Create ZIP and get info
        id: build
        shell: pwsh
        run: |
          $displayName = "${{ steps.brand.outputs.display_name }}"
          $appName = "${{ steps.brand.outputs.app_name }}"
          $releaseDir = "build\windows\x64\runner\Release"
          $releaseDirPath = (Resolve-Path $releaseDir).Path
          $FILE_NAME = "$appName-windows.zip"

          # 当显示名与包名不同时，创建 .bat 启动脚本（纯文本，支持中文文件名）
          if ($displayName -ne $appName) {
            $batContent = "@echo off`r`nstart """" ""%~dp0$appName.exe"""
            $batPath = Join-Path $releaseDirPath "$displayName.bat"
            [System.IO.File]::WriteAllText($batPath, $batContent, [System.Text.Encoding]::GetEncoding(936))
            if (!(Test-Path $batPath)) {
              throw "Failed to create launcher bat: $batPath"
            }

            # 为 bat 启动器生成同名中文快捷方式，便于用户双击使用
            $shell = New-Object -ComObject WScript.Shell
            $shortcutTempPath = Join-Path $releaseDirPath "__launcher__.lnk"
            $shortcutPath = Join-Path $releaseDirPath "$displayName.lnk"
            if (Test-Path $shortcutTempPath) {
              Remove-Item -Path $shortcutTempPath -Force
            }
            if (Test-Path $shortcutPath) {
              Remove-Item -Path $shortcutPath -Force
            }
            $shortcut = $shell.CreateShortcut($shortcutTempPath)
            $exePath = Join-Path $releaseDirPath "$appName.exe"
            if (!(Test-Path $exePath)) {
              throw "Launcher target exe not found: $exePath"
            }
            # 这里使用 ASCII 的 exe 作为 TargetPath，避免 COM 在中文 bat 路径上报错
            $shortcut.TargetPath = $exePath
            $shortcut.WorkingDirectory = $releaseDirPath
            $shortcut.Description = "$displayName Launcher"
            $shortcut.Save()
            Move-Item -Path $shortcutTempPath -Destination $shortcutPath -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $FILE_NAME
          $FILE_SIZE = (Get-Item $FILE_NAME).Length
          echo "file_name=$FILE_NAME" >> $env:GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.build.outputs.file_name }}

      - name: Download VC++ Redistributable
        shell: bash
        run: curl -fsSL --retry 3 -o vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"

      - name: Build Inno Setup EXE
        id: build_exe
        shell: bash
        run: |
          # 从 pubspec.yaml 读取版本号
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)

          dart scripts/build_inno_setup.dart \
            --source-dir "build\\windows\\x64\\runner\\Release" \
            --app-version "$VERSION" \
            --display-name "${{ steps.brand.outputs.display_name }}"

          APP_NAME="${{ steps.brand.outputs.app_name }}"
          FILE_NAME="${APP_NAME}-windows-setup.exe"
          mv "windows/packaging/exe/${APP_NAME}.exe" "$FILE_NAME"
          FILE_SIZE=$(stat -c%s "$FILE_NAME" 2>/dev/null || powershell -c "(Get-Item '$FILE_NAME').Length")
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-build
          path: ${{ steps.build_exe.outputs.file_name }}

  build-android:
    if: ${{ github.event.inputs.platform == 'all' || contains(format(',{0},', github.event.inputs.platform), ',android,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      file_name: ${{ steps.build.outputs.file_name }}
      file_size: ${{ steps.build.outputs.file_size }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout private repo
        uses: actions/checkout@v5
        with:
          repository: PangHu-Code/client
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.client_ref || 'main' }}
          submodules: recursive

      - name: Use published yaml_writer package
        shell: bash
        run: |
          if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
            perl -0pi -e "s#  yaml_writer:\r?\n    git:\r?\n      url: [\"']?https://github\.com/chen08209/yaml_writer[\"']?\r?\n      ref: [\"']?master[\"']?#  yaml_writer: ^2.1.0#g" pubspec.yaml
            if grep -q "github.com/chen08209/yaml_writer" pubspec.yaml; then
              echo "Failed to replace yaml_writer git dependency"
              exit 1
            fi
            rm -f pubspec.lock
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: true
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter (Android)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set brand variables
        id: brand
        run: |
          echo "app_name=${{ github.event.inputs.brand_app_name }}" >> $GITHUB_OUTPUT
          echo "display_name=${{ github.event.inputs.brand_display_name }}" >> $GITHUB_OUTPUT
          echo "package_id=${{ github.event.inputs.brand_package_id }}" >> $GITHUB_OUTPUT

      - name: Build Core (Android arm64-v8a)
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd core
          mkdir -p ../libclash/android/arm64-v8a
          TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$CC \
            go build -ldflags="-w -s" -tags="with_gvisor" -buildmode=c-shared \
            -o ../libclash/android/arm64-v8a/libclash.so
          mkdir -p ../libclash/android/includes/arm64-v8a
          cp ../libclash/android/arm64-v8a/libclash.h ../libclash/android/includes/arm64-v8a/ 2>/dev/null || true
          cp bride.h ../libclash/android/includes/arm64-v8a/ 2>/dev/null || true
          rm -f ../libclash/android/arm64-v8a/*.h 2>/dev/null || true

      - name: Apply brand config
        env:
          BRAND_APP_NAME: ${{ github.event.inputs.brand_app_name }}
          BRAND_DISPLAY_NAME: ${{ github.event.inputs.brand_display_name }}
          BRAND_PACKAGE_ID: ${{ github.event.inputs.brand_package_id }}
          BRAND_OSS_URLS: ${{ github.event.inputs.brand_oss_urls }}
        run: dart scripts/apply_brand.dart

      - name: Setup Android signing
        run: |
          echo "storePassword=panghu123456" >> android/local.properties
          echo "keyAlias=release" >> android/local.properties
          echo "keyPassword=panghu123456" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ls -la libclash/android/arm64-v8a/
          flutter build apk --release --dart-define=APP_ENV=stable

      - name: Rename APK and get info
        id: build
        run: |
          FILE_NAME="${{ steps.brand.outputs.app_name }}-android.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$FILE_NAME"
          FILE_SIZE=$(stat -c%s "$FILE_NAME")
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ steps.build.outputs.file_name }}

  # 汇总并回调（仅当 Bot 触发时执行）
  callback:
    needs: [build-macos, build-macos-intel, build-windows, build-android]
    # 即使部分平台跳过或失败也要执行回调
    if: ${{ always() && github.event.inputs.build_id != '' && github.event.inputs.callback_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Verify AWS CLI
        run: aws --version

      - name: Upload to R2 and callback
        env:
          BUILD_ID: ${{ github.event.inputs.build_id }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PLATFORM: ${{ github.event.inputs.platform }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          MACOS_FILE_NAME: ${{ needs.build-macos.outputs.file_name }}
          MACOS_FILE_SIZE: ${{ needs.build-macos.outputs.file_size }}
          MACOS_INTEL_RESULT: ${{ needs.build-macos-intel.result }}
          MACOS_INTEL_FILE_NAME: ${{ needs.build-macos-intel.outputs.file_name }}
          MACOS_INTEL_FILE_SIZE: ${{ needs.build-macos-intel.outputs.file_size }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          WINDOWS_FILE_NAME: ${{ needs.build-windows.outputs.file_name }}
          WINDOWS_FILE_SIZE: ${{ needs.build-windows.outputs.file_size }}
          WINDOWS_EXE_FILE_NAME: ${{ needs.build-windows.outputs.exe_file_name }}
          WINDOWS_EXE_FILE_SIZE: ${{ needs.build-windows.outputs.exe_file_size }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          ANDROID_FILE_NAME: ${{ needs.build-android.outputs.file_name }}
          ANDROID_FILE_SIZE: ${{ needs.build-android.outputs.file_size }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: "https://391f65c1b011cc9d37d9687a761b9ddf.r2.cloudflarestorage.com"
          R2_BUCKET: "flclash-builds"
        run: |
          echo "Checking build results..."

          # 收集成功的构建产物
          ARTIFACTS='[]'
          ERROR_MESSAGE=""
          HAS_SUCCESS=false

          should_build() {
            local target=$1
            [ "$PLATFORM" = "all" ] || [[ ",$PLATFORM," == *",$target,"* ]]
          }

          # 上传函数：使用 AWS CLI 上传到 R2
          upload_to_r2() {
            local file_path=$1
            local file_key=$2
            echo "Uploading $file_key to R2..."
            aws s3 cp "$file_path" "s3://$R2_BUCKET/$file_key" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress
            echo "Upload complete: $file_key"
          }

          # 检查 macOS (Apple Silicon)
          if should_build "macos"; then
            if [ "$MACOS_RESULT" == "success" ] && [ -f "artifacts/macos-build/$MACOS_FILE_NAME" ]; then
              # 本地化文件名：飞驰代理-macOS-arm64.dmg（用户下载体验优化）
              DISPLAY_NAME="${{ github.event.inputs.brand_display_name }}"
              EXT="${MACOS_FILE_NAME##*.}"  # 提取扩展名 dmg 或 zip
              LOCALIZED_FILE="${DISPLAY_NAME}-macOS-arm64.${EXT}"
              cp "artifacts/macos-build/$MACOS_FILE_NAME" "$LOCALIZED_FILE"

              FILE_KEY="$BUILD_ID/macos/$LOCALIZED_FILE"
              upload_to_r2 "$LOCALIZED_FILE" "$FILE_KEY"
              ARTIFACTS=$(echo "$ARTIFACTS" | jq --arg platform "macos-arm64" --arg file_key "$FILE_KEY" --arg file_size "$MACOS_FILE_SIZE" \
                '. + [{"platform": $platform, "file_key": $file_key, "file_size": ($file_size | tonumber)}]')
              HAS_SUCCESS=true
              rm -f "$LOCALIZED_FILE"
            else
              ERROR_MESSAGE="${ERROR_MESSAGE}macOS 构建失败; "
            fi
          fi

          # 检查 macOS (Intel)
          if should_build "macos"; then
            if [ "$MACOS_INTEL_RESULT" == "success" ] && [ -f "artifacts/macos-intel-build/$MACOS_INTEL_FILE_NAME" ]; then
              # 本地化文件名：飞驰代理-macOS-intel.dmg（用户下载体验优化）
              DISPLAY_NAME="${{ github.event.inputs.brand_display_name }}"
              EXT="${MACOS_INTEL_FILE_NAME##*.}"  # 提取扩展名 dmg 或 zip
              LOCALIZED_FILE="${DISPLAY_NAME}-macOS-intel.${EXT}"
              cp "artifacts/macos-intel-build/$MACOS_INTEL_FILE_NAME" "$LOCALIZED_FILE"

              FILE_KEY="$BUILD_ID/macos-intel/$LOCALIZED_FILE"
              upload_to_r2 "$LOCALIZED_FILE" "$FILE_KEY"
              ARTIFACTS=$(echo "$ARTIFACTS" | jq --arg platform "macos-amd64" --arg file_key "$FILE_KEY" --arg file_size "$MACOS_INTEL_FILE_SIZE" \
                '. + [{"platform": $platform, "file_key": $file_key, "file_size": ($file_size | tonumber)}]')
              HAS_SUCCESS=true
              rm -f "$LOCALIZED_FILE"
            else
              ERROR_MESSAGE="${ERROR_MESSAGE}macOS Intel 构建失败; "
            fi
          fi

          # 检查 Windows ZIP
          if should_build "windows"; then
            if [ "$WINDOWS_RESULT" == "success" ] && [ -f "artifacts/windows-build/$WINDOWS_FILE_NAME" ]; then
              # 本地化文件名：飞驰代理-windows.zip（用户下载体验优化）
              DISPLAY_NAME="${{ github.event.inputs.brand_display_name }}"
              LOCALIZED_ZIP="${DISPLAY_NAME}-windows.zip"
              cp "artifacts/windows-build/$WINDOWS_FILE_NAME" "$LOCALIZED_ZIP"

              FILE_KEY="$BUILD_ID/windows/$LOCALIZED_ZIP"
              upload_to_r2 "$LOCALIZED_ZIP" "$FILE_KEY"
              ARTIFACTS=$(echo "$ARTIFACTS" | jq --arg platform "windows-zip" --arg file_key "$FILE_KEY" --arg file_size "$WINDOWS_FILE_SIZE" \
                '. + [{"platform": $platform, "file_key": $file_key, "file_size": ($file_size | tonumber)}]')
              HAS_SUCCESS=true
              rm -f "$LOCALIZED_ZIP"
            else
              ERROR_MESSAGE="${ERROR_MESSAGE}Windows 构建失败; "
            fi
          fi

          # 检查 Windows EXE
          if should_build "windows"; then
            if [ "$WINDOWS_RESULT" == "success" ] && [ -n "$WINDOWS_EXE_FILE_NAME" ] && [ -f "artifacts/windows-exe-build/$WINDOWS_EXE_FILE_NAME" ]; then
              # 本地化文件名：飞驰代理-Setup.exe（用户下载体验优化）
              DISPLAY_NAME="${{ github.event.inputs.brand_display_name }}"
              LOCALIZED_EXE="${DISPLAY_NAME}-Setup.exe"
              cp "artifacts/windows-exe-build/$WINDOWS_EXE_FILE_NAME" "$LOCALIZED_EXE"

              FILE_KEY="$BUILD_ID/windows-exe/$LOCALIZED_EXE"
              upload_to_r2 "$LOCALIZED_EXE" "$FILE_KEY"
              ARTIFACTS=$(echo "$ARTIFACTS" | jq --arg platform "windows-exe" --arg file_key "$FILE_KEY" --arg file_size "$WINDOWS_EXE_FILE_SIZE" \
                '. + [{"platform": $platform, "file_key": $file_key, "file_size": ($file_size | tonumber)}]')
              HAS_SUCCESS=true
              rm -f "$LOCALIZED_EXE"
            else
              ERROR_MESSAGE="${ERROR_MESSAGE}Windows EXE 构建失败; "
            fi
          fi

          # 检查 Android
          if should_build "android"; then
            if [ "$ANDROID_RESULT" == "success" ] && [ -f "artifacts/android-build/$ANDROID_FILE_NAME" ]; then
              # 本地化文件名：飞驰代理.apk（用户下载体验优化）
              DISPLAY_NAME="${{ github.event.inputs.brand_display_name }}"
              LOCALIZED_APK="${DISPLAY_NAME}.apk"
              cp "artifacts/android-build/$ANDROID_FILE_NAME" "$LOCALIZED_APK"

              FILE_KEY="$BUILD_ID/android/$LOCALIZED_APK"
              upload_to_r2 "$LOCALIZED_APK" "$FILE_KEY"
              ARTIFACTS=$(echo "$ARTIFACTS" | jq --arg platform "android" --arg file_key "$FILE_KEY" --arg file_size "$ANDROID_FILE_SIZE" \
                '. + [{"platform": $platform, "file_key": $file_key, "file_size": ($file_size | tonumber)}]')
              HAS_SUCCESS=true
              rm -f "$LOCALIZED_APK"
            else
              ERROR_MESSAGE="${ERROR_MESSAGE}Android 构建失败; "
            fi
          fi

          # 发送回调
          if [ "$HAS_SUCCESS" == "true" ]; then
            echo "Sending success callback..."
            curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: repository_dispatch" \
              -H "X-Hub-Signature-256: $(echo -n "{\"action\":\"build_complete\",\"client_payload\":{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifacts\":$ARTIFACTS}}" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* /sha256=/')" \
              -d "{\"action\":\"build_complete\",\"client_payload\":{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"artifacts\":$ARTIFACTS}}"
          else
            echo "Sending failure callback..."
            curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: repository_dispatch" \
              -H "X-Hub-Signature-256: $(echo -n "{\"action\":\"build_complete\",\"client_payload\":{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error_message\":\"$ERROR_MESSAGE\"}}" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* /sha256=/')" \
              -d "{\"action\":\"build_complete\",\"client_payload\":{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error_message\":\"$ERROR_MESSAGE\"}}"
          fi
