          EOF

          # 生成 DMG
          FILE_NAME="${APP_NAME}-macos-intel.dmg"
          appdmg dmg_config.json "$FILE_NAME" || {
            echo "appdmg failed, fallback to ZIP"
            FILE_NAME="${APP_NAME}-macos-intel.zip"
            zip -r "$FILE_NAME" "$DISPLAY_NAME.app"
          }

          FILE_SIZE=$(stat -f%z "$FILE_NAME")
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
